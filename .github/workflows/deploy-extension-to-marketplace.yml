name: Docker Build and Push to AWS Marketplace

# This workflow builds and submits Liquibase Secure Docker images to AWS Marketplace
#
# Usage:
# - Automatically triggered by auto-trigger-marketplace-deployment.yml when liquibase-secure version changes (dry_run=true, test image)
# - Automatically triggered by Lambda after test image validation succeeds (dry_run=false, production release)
# - Can be manually triggered for custom releases
#
# Modes:
# - dry_run=true: Builds test image (e.g., test-5.0.2) for validation before production
# - dry_run=false: Builds production image (uses version from Dockerfile) for public release

# Production gets its own group: GitHub keeps one pending run per group and
# cancels it when another dispatch arrives, so a dry run queued behind a waiting
# production run would drop that release without a trace.
concurrency:
  group: deploy-to-marketplace-${{ inputs.dry_run && 'dry-run' || 'production' }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Test image tag for the ECR liquibase/liquibaseSecure, required for a dry run and must start with `test-` or `qa-` (QA-use e.g `qa-<version>`). Ignored when dry_run is false.'
        # Not required: the poller's production dispatch sends only
        # validated_version, and GitHub rejects a dispatch missing a required
        # input with a 422, which stalled the 6.0.0 release.
        required: false
        default: ''
      # Deliberately separate from image_tag. image_tag is the prefixed ECR tag
      # the dry-run job builds; this is a bare liquibase-secure version that
      # already passed ECS validation, and the production job compares it with
      # the Dockerfile.
      validated_version:
        description: 'Set by the marketplace poller: the liquibase-secure version that passed ECS validation. Leave empty to release whatever is on main.'
        required: false
        default: ''
      dry_run:
        # Defaults to true so a manual Run workflow with the defaults cannot
        # publish a public version; the poller and auto-trigger set it explicitly.
        description: 'Run this as a dry run. Uncheck only to publish a public marketplace version.'
        required: false
        type: boolean
        default: true

jobs:
#  https://datical.atlassian.net/browse/DAT-18638
#  We run this job to ensure that the right Liquibase-Secure-version is in Dockerfile and pom prior to submitting a new version to AWS Marketplace for approval
  check-secure-version:
    runs-on:
      ubuntu-latest
    outputs:
      SECURE_VERSION_MATCH: ${{ steps.check_versions.outputs.versions_match }}
    steps:
      # image_tag is optional at the input level so the production dispatch is
      # accepted. A bare version would push the immutable release tag to ECR and
      # submit it as public, breaking the real release, so require the prefix.
      - name: Require a test- or qa- image_tag for a dry run
        if: ${{ inputs.dry_run }}
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "${IMAGE_TAG}" =~ ^(test|qa)- ]]; then
            echo "::error::A dry run needs an image_tag starting with test- or qa-, got '${IMAGE_TAG}'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get liquibase Secure version from pom.xml
        id: pom_liquibase_secure_version
        run: |
          POM_LIQUIBASE_SECURE_VERSION=$(grep -oE '<liquibase-secure.version>[^<]+</liquibase-secure.version>' pom.xml | sed -E 's/<\/?liquibase-secure.version>//g')
          echo "Liquibase Secure version: $POM_LIQUIBASE_SECURE_VERSION"
          echo "pom_liquibase_secure_version=$POM_LIQUIBASE_SECURE_VERSION" >> $GITHUB_OUTPUT

      - name: Get liquibase Secure version from Dockerfile
        id: dockerfile_liquibase_secure_version
        run: |
          DOCKERFILE_LIQUIBASE_SECURE_VERSION=$(grep -E '^FROM liquibase/liquibase-secure:' Dockerfile | head -1 | cut -d':' -f2 | cut -d' ' -f1)
          echo "Liquibase Secure version: $DOCKERFILE_LIQUIBASE_SECURE_VERSION"
          echo "dockerfile_liquibase_secure_version=$DOCKERFILE_LIQUIBASE_SECURE_VERSION" >> $GITHUB_OUTPUT

      # The two versions are read from step outputs, NOT from bare shell variables.
      # Writing to $GITHUB_OUTPUT does not export a value into a later step's
      # environment, so the previous form compared two unset variables: "" == ""
      # was always true and this gate could never fail. It let a run whose
      # Dockerfile and pom disagreed proceed to submit a marketplace version.
      - name: Check if versions match
        id: check_versions
        env:
          POM_VERSION: ${{ steps.pom_liquibase_secure_version.outputs.pom_liquibase_secure_version }}
          DOCKERFILE_VERSION: ${{ steps.dockerfile_liquibase_secure_version.outputs.dockerfile_liquibase_secure_version }}
        run: |
          echo "pom.xml:    '${POM_VERSION}'"
          echo "Dockerfile: '${DOCKERFILE_VERSION}'"

          # An empty value means the grep above stopped matching, e.g. after a
          # Dockerfile or pom restructure. Treat it as a failure rather than
          # letting two empty strings compare equal.
          if [ -z "$POM_VERSION" ] || [ -z "$DOCKERFILE_VERSION" ]; then
            echo "versions_match=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not read the liquibase-secure version from pom.xml ('${POM_VERSION}') and/or Dockerfile ('${DOCKERFILE_VERSION}'). Refusing to submit a marketplace version."
            exit 1
          fi

          if [ "$POM_VERSION" != "$DOCKERFILE_VERSION" ]; then
            echo "versions_match=false" >> "$GITHUB_OUTPUT"
            echo "::error::liquibase-secure version mismatch. Dockerfile: ${DOCKERFILE_VERSION}, pom.xml: ${POM_VERSION}. The image would be built from one version and labelled with another, so refusing to continue."
            exit 1
          fi

          echo "versions_match=true" >> "$GITHUB_OUTPUT"
          echo "✅ Versions match: ${POM_VERSION}"

  dry-run:
    # run this job for a dry run (auto-trigger's test- image, or a manual qa- image)
    # for QA testing of the new version prior to submitting to AWS Marketplace for approval please use qa-<version> as image_tag
    if: ${{ inputs.dry_run == true }}
    runs-on:
      ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: check-secure-version
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_MP_GITHUB_OIDC_ROLE_ARN_AWS_LICENSE_SERVICE }}
          aws-region: us-east-1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ECR Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.AWS_MP_REGISTRY }}
          username: ${{ env.AWS_MP_ACCESS_KEY }}
          password: ${{ env.AWS_MP_ACCESS_KEY_ID }}

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ env.AWS_MP_REGISTRY }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          no-cache: true
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false # Disables the generation of provenance attestation
          tags: ${{ env.AWS_MP_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}

      # No continue-on-error here. It used to swallow a failed push and let the
      # next step submit a marketplace version pointing at whatever image was
      # already sitting in ECR under that tag. ECR tags are immutable, so a
      # re-run of an existing tag fails the push and the submitted version would
      # describe stale content while the job reported success.

      - name: Submit New Version Request for AWS MP Listing
        env:
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: "${{ inputs.image_tag }}"
          PRODUCT_ID: ${{ env.PRODUCT_ID }}
          AWS_MP_REGISTRY: ${{ env.AWS_MP_REGISTRY }}
        run: |
          chmod +x ./.github/utils/submit-aws-mp-listing.sh
          ./.github/utils/submit-aws-mp-listing.sh
          
  build:
      # submit a new version to AWS Marketplace that will be reviewed by AWS
      if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
      runs-on:
          ubuntu-latest
      permissions:
        id-token: write
        contents: read
      needs: check-secure-version
      env:
        AWS_REGION: us-east-1
      steps:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          - name: Configure AWS credentials for vault access
            uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
            with:
              role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
              aws-region: us-east-1

          - name: Get secrets from vault
            id: vault-secrets
            uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
            with:
              secret-ids: |
                ,/vault/liquibase
              parse-json-secrets: true

          - name: Configure AWS Credentials
            uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
            with:
              role-to-assume: ${{ env.AWS_MP_GITHUB_OIDC_ROLE_ARN_AWS_LICENSE_SERVICE }}
              aws-region: us-east-1

          - name: Set up QEMU
            uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

          - name: Login to ECR Registry
            uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
            with:
              registry: ${{ env.AWS_MP_REGISTRY }}
              username: ${{ env.AWS_MP_ACCESS_KEY }}
              password: ${{ env.AWS_MP_ACCESS_KEY_ID }}

          - name: Get latest liquibase docker tag
            id: get_latest_tag
            run: |
              LATEST_TAG=$(grep -i "^FROM liquibase/liquibase-secure:" Dockerfile | head -n1 | sed -E 's/^FROM liquibase\/liquibase-secure:([^ ]+).*/\1/')
              echo "LATEST_TAG=$LATEST_TAG"
              echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT

          # This job builds and submits whatever version the Dockerfile on main
          # says, which is not necessarily the version that was validated. The
          # poller dispatches the validated version as validated_version so the two can
          # be compared here. A mismatch means main moved between validation and
          # release, and publishing would ship a version nobody tested. Public
          # marketplace versions cannot be deleted, only restricted, so this
          # fails instead.
          #
          # validated_version is empty for manual dispatches that intend "just
          # release what is on main"; those skip the check rather than fail.
          # This job ignores image_tag, which is the dry run's prefixed ECR tag.
          - name: Verify the Dockerfile matches the validated version
            env:
              VALIDATED_VERSION: "${{ inputs.validated_version }}"
              DOCKERFILE_VERSION: "${{ steps.get_latest_tag.outputs.LATEST_TAG }}"
            run: |
              if [ -z "${VALIDATED_VERSION}" ]; then
                echo "No validated version supplied; releasing the Dockerfile version ${DOCKERFILE_VERSION}."
                exit 0
              fi

              if [ "${VALIDATED_VERSION}" != "${DOCKERFILE_VERSION}" ]; then
                echo "::error::Validated version '${VALIDATED_VERSION}' does not match Dockerfile version '${DOCKERFILE_VERSION}'. Refusing to publish an unvalidated version."
                exit 1
              fi

              echo "✅ Dockerfile version ${DOCKERFILE_VERSION} matches the validated version."

          - name: Build and Push Docker Image
            env:
              ECR_REGISTRY: ${{ env.AWS_MP_REGISTRY }}
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
              context: .
              file: Dockerfile
              no-cache: true
              push: true
              platforms: linux/amd64,linux/arm64
              provenance: false # Disables the generation of provenance attestation
              tags: ${{ env.AWS_MP_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.get_latest_tag.outputs.LATEST_TAG }}

          # No continue-on-error here, for the same reason as the dry-run job.
          # On this path the consequence is worse: a masked push failure would
          # submit a PUBLIC version describing an image that was never pushed.

          - name: Submit Request for AWS MP Listing
            env:
              ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
              IMAGE_TAG: "${{ steps.get_latest_tag.outputs.LATEST_TAG }}"
              PRODUCT_ID: ${{ env.PRODUCT_ID }}
              AWS_MP_REGISTRY: ${{ env.AWS_MP_REGISTRY }}
            run: |
              chmod +x ./.github/utils/submit-aws-mp-listing.sh
              ./.github/utils/submit-aws-mp-listing.sh


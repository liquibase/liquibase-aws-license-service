name: Marketplace Release Watchdog

# Fails loudly when a marketplace release is stuck part-way.
#
# The 5.2.2 release stalled between validation and publication and nothing said
# so. The polling Lambda logged the same waiting line every 15 minutes for over
# 30 hours; the pipeline looked idle rather than broken, and it was only noticed
# because someone went looking. Nothing in this system distinguishes "no release
# in progress" from "a release wedged".
#
# This is that distinction. A tracked validation that passed should reach
# production within roughly an hour: the test image restriction takes about 15
# minutes, the poller notices within 15, and the production submission is
# minutes. Anything still sitting in testStatus=completed hours later is stuck.
#
# Failing the run is the alert. That matches how the other scheduled workflows in
# this repository surface problems and needs no new webhook. Add a Slack step if
# a louder channel is wanted.

on:
  schedule:
    - cron: '25 */2 * * *' # every two hours
  workflow_dispatch:
    inputs:
      stall_hours:
        description: 'Hours a completed test may wait for release before it counts as stalled'
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  group: marketplace-release-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      TABLE_NAME: liquibase-secure-marketplace-changesets
      PRODUCT_ID: prod-l2panlvbozc5e
      STALL_HOURS: ${{ inputs.stall_hours || '3' }}
    steps:
      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_MP_GITHUB_OIDC_ROLE_ARN_AWS_LICENSE_SERVICE }}
          aws-region: us-east-1

      - name: Look for stalled releases
        run: |
          set -euo pipefail

          # testStatus=completed means validation passed and the release is
          # waiting on the restriction to be confirmed. It is a transient state;
          # anything lingering in it is the failure mode we are watching for.
          aws dynamodb scan \
            --table-name "${TABLE_NAME}" \
            --region "${AWS_REGION}" \
            --filter-expression 'testStatus = :s' \
            --expression-attribute-values '{":s":{"S":"completed"}}' \
            --output json > scan.json

          COUNT=$(jq '.Items | length' scan.json)
          echo "Tracked validations awaiting release: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "✅ Nothing waiting."
            exit 0
          fi

          # createdDate is an ISO-8601 string written by the poller.
          jq -r '.Items[] | [(.imageTag.S // "unknown"), (.changeSetId.S // "unknown"), (.createdDate.S // "unknown")] | @tsv' scan.json > waiting.tsv

          STALLED=0
          CUTOFF=$(( $(date -u +%s) - STALL_HOURS * 3600 ))

          while IFS=$'\t' read -r TAG CHANGESET CREATED; do
            CREATED_TS=$(date -u -d "${CREATED}" +%s 2>/dev/null || echo 0)

            if [ "${CREATED_TS}" -eq 0 ]; then
              echo "⚠️  ${TAG} (${CHANGESET}): unparseable createdDate '${CREATED}', treating as stalled"
              STALLED=$((STALLED + 1))
              continue
            fi

            AGE_HOURS=$(( ( $(date -u +%s) - CREATED_TS ) / 3600 ))

            if [ "${CREATED_TS}" -lt "${CUTOFF}" ]; then
              echo "❌ ${TAG} (${CHANGESET}): waiting ${AGE_HOURS}h for production release"
              STALLED=$((STALLED + 1))
            else
              echo "⏳ ${TAG} (${CHANGESET}): waiting ${AGE_HOURS}h, still inside the ${STALL_HOURS}h window"
            fi
          done < waiting.tsv

          echo "STALLED=${STALLED}" >> "$GITHUB_ENV"
          echo "AWAITING=${COUNT}" >> "$GITHUB_ENV"

      # The check above only sees versions the poller already tracked. It is
      # blind to the opposite failure: a test version published to the listing
      # that the poller never picked up at all, so nothing was ever written to
      # DynamoDB. That happens if the poller is down or wedged for longer than
      # its LOOKBACK_DAYS window, after which the version falls out of its scan
      # permanently and no amount of waiting recovers it.
      #
      # A test version still Public and untracked is the signature. Restricted
      # ones have already been through validation.
      - name: Look for test versions the poller never picked up
        run: |
          set -euo pipefail

          aws marketplace-catalog describe-entity \
            --catalog AWSMarketplace \
            --entity-id "${PRODUCT_ID}" \
            --region "${AWS_REGION}" \
            --output json > entity.json

          # Every imageTag the poller knows about, whatever its state.
          aws dynamodb scan \
            --table-name "${TABLE_NAME}" \
            --region "${AWS_REGION}" \
            --projection-expression 'imageTag' \
            --output json > tracked.json

          jq -r '.Items[]?.imageTag.S // empty' tracked.json | sort -u > tracked.txt

          # Public test-* versions, newest first, with their creation dates.
          jq -r '
            .Details
            | fromjson
            | .Versions[]
            | select(.VersionTitle | startswith("test-"))
            | select([.DeliveryOptions[]?.Visibility] | any(. == "Public"))
            | [.VersionTitle, .CreationDate] | @tsv
          ' entity.json > public_test_versions.tsv || true

          ORPHANED=0
          CUTOFF=$(( $(date -u +%s) - STALL_HOURS * 3600 ))
          # Ignore ancient history; this is about recent releases going missing.
          FLOOR=$(( $(date -u +%s) - 30 * 86400 ))

          while IFS=$'\t' read -r TITLE CREATED; do
            [ -z "${TITLE:-}" ] && continue

            if grep -Fxq "${TITLE}" tracked.txt; then
              continue
            fi

            CREATED_TS=$(date -u -d "${CREATED}" +%s 2>/dev/null || echo 0)
            [ "${CREATED_TS}" -lt "${FLOOR}" ] && continue

            if [ "${CREATED_TS}" -lt "${CUTOFF}" ]; then
              AGE_HOURS=$(( ( $(date -u +%s) - CREATED_TS ) / 3600 ))
              echo "❌ ${TITLE}: published ${AGE_HOURS}h ago, still Public, and the poller never tracked it"
              ORPHANED=$((ORPHANED + 1))
            fi
          done < public_test_versions.tsv

          if [ "${ORPHANED}" -eq 0 ]; then
            echo "✅ Every recent public test version is tracked."
          fi

          echo "ORPHANED=${ORPHANED}" >> "$GITHUB_ENV"

      - name: Report
        run: |
          set -euo pipefail

          {
            echo "## Marketplace release watchdog"
            echo ""
            echo "Awaiting release: ${AWAITING}. Stalled beyond ${STALL_HOURS}h: ${STALLED}."
            echo "Published but never tracked by the poller: ${ORPHANED}."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${ORPHANED}" -gt 0 ]; then
            {
              echo ""
              echo "A test version reached the listing but the poller never adopted it."
              echo "Likely the poller was down or wedged for longer than its LOOKBACK_DAYS"
              echo "window, after which the version falls out of its scan for good."
              echo "Validation for these has to be dispatched by hand."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${STALLED}" -gt 0 ]; then
            {
              echo ""
              echo "A validated test image has not reached production release. Usual causes:"
              echo ""
              echo "* the poller cannot match the restriction change set, so the release never triggers"
              echo "* the restriction change set failed on the marketplace side"
              echo "* the production dispatch failed and nothing retried"
              echo ""
              echo "Check the PollMarketplaceChangeSetStatus logs and the change sets on the listing."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::${STALLED} marketplace release(s) stalled for more than ${STALL_HOURS}h."
          fi

          if [ "${STALLED}" -gt 0 ] || [ "${ORPHANED}" -gt 0 ]; then
            if [ "${ORPHANED}" -gt 0 ]; then
              echo "::error::${ORPHANED} published test version(s) were never picked up by the poller."
            fi
            exit 1
          fi

          echo "✅ Everything waiting is still inside the expected window, and every recent test version is tracked."

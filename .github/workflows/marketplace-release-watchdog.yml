name: Marketplace Release Watchdog

# Fails loudly when a marketplace release is stuck part-way.
#
# The 5.2.2 release stalled between validation and publication and nothing said
# so. The polling Lambda logged the same waiting line every 15 minutes for over
# 30 hours; the pipeline looked idle rather than broken, and it was only noticed
# because someone went looking. Nothing in this system distinguishes "no release
# in progress" from "a release wedged".
#
# This is that distinction. A tracked validation that passed should reach
# production within roughly an hour: the test image restriction takes about 15
# minutes, the poller notices within 15, and the production submission is
# minutes. Anything still sitting in testStatus=completed hours later is stuck.
#
# Failing the run is the alert. That matches how the other scheduled workflows in
# this repository surface problems and needs no new webhook. Add a Slack step if
# a louder channel is wanted.

on:
  schedule:
    - cron: '25 */2 * * *' # every two hours
  workflow_dispatch:
    inputs:
      stall_hours:
        description: 'Hours a completed test may wait for release before it counts as stalled'
        required: false
        # Two, not three: the schedule runs every two hours, so a three-hour
        # threshold lets a stall sit undetected for up to five. The expected
        # end-to-end wait is about one hour, so two still leaves slack.
        default: '2'

permissions:
  contents: read

concurrency:
  group: marketplace-release-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      # These three are prefixed, and must stay prefixed.
      #
      # "Get secrets from vault" runs aws-secretsmanager-get-secrets with
      # parse-json-secrets, which turns every key in /vault/liquibase into an
      # environment variable and REFUSES to overwrite a name that already
      # exists: "The environment name 'PRODUCT_ID' is already in use." Job-level
      # env is set before that step runs, so an unprefixed PRODUCT_ID collided
      # with a vault key and failed the step outright. Both scans were then
      # skipped, which meant this watchdog could never once report a stall: the
      # alarm for silent failures, silently doing nothing.
      #
      # AWS_REGION is left bare on purpose. configure-aws-credentials sets it
      # before the vault step and that did not collide, so it is not a key in
      # the secret.
      MP_TABLE_NAME: liquibase-secure-marketplace-changesets
      MP_PRODUCT_ID: prod-l2panlvbozc5e
      MP_STALL_HOURS: ${{ inputs.stall_hours || '2' }}
    steps:
      # MP_STALL_HOURS reaches both scan steps as arithmetic. A non-numeric value
      # aborts the step under `set -e`, and a zero-padded one like "08" is read
      # as octal and fails outright, so it is normalised and bounded once here
      # rather than trusted twice below.
      - name: Validate the stall threshold
        run: |
          set -euo pipefail

          if [[ ! "${MP_STALL_HOURS}" =~ ^[0-9]+$ ]]; then
            echo "::error::stall_hours must be a whole number of hours, got '${MP_STALL_HOURS}'"
            exit 1
          fi

          # 10# forces base 10 so a leading zero is not read as octal.
          HOURS=$((10#${MP_STALL_HOURS}))

          if [ "${HOURS}" -lt 1 ] || [ "${HOURS}" -gt 168 ]; then
            echo "::error::stall_hours must be between 1 and 168, got '${MP_STALL_HOURS}'"
            exit 1
          fi

          echo "MP_STALL_HOURS=${HOURS}" >> "$GITHUB_ENV"
          echo "Stall threshold: ${HOURS}h"

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_MP_GITHUB_OIDC_ROLE_ARN_AWS_LICENSE_SERVICE }}
          aws-region: us-east-1

      - name: Look for stalled releases
        run: |
          set -euo pipefail

          # All three states are transient, and anything lingering in any of
          # them is the failure mode we are watching for:
          #   testing               validation dispatched, not yet reported back
          #   completed             validation passed, waiting on the restriction
          #   production_dispatched GitHub accepted the release run, but the
          #                         version is not public on the listing yet
          # The last exists because a 204 from the dispatch API is not a
          # release: the run can still fail at the Docker push or the
          # validated-version gate, and the poller deliberately does not promote
          # the row until the listing proves otherwise.
          #
          # `testing` is here because it is where a release dies quietly. The
          # ECS run or the restrict step can hang or be cancelled before
          # anything sets testStatus=completed, and such a row then ages
          # forever: the poller's pass 2 only reads completed rows, and the
          # orphan scan skips it because the poller did track the imageTag. It
          # is the stalled state the ticket asks this watchdog to catch, and it
          # was the one state it could not see.
          aws dynamodb scan \
            --table-name "${MP_TABLE_NAME}" \
            --region "${AWS_REGION}" \
            --filter-expression 'testStatus IN (:testing, :completed, :dispatched)' \
            --expression-attribute-values '{":testing":{"S":"testing"},":completed":{"S":"completed"},":dispatched":{"S":"production_dispatched"}}' \
            --output json > scan.json

          COUNT=$(jq '.Items | length' scan.json)
          echo "Tracked validations awaiting release: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "✅ Nothing waiting."
            # Export before exiting. The Report step runs `set -u`, so leaving
            # these unset failed the job on the HEALTHY path: nothing waiting is
            # the state this watchdog is in almost every run.
            echo "AWAITING=0" >> "$GITHUB_ENV"
            echo "STALLED=0" >> "$GITHUB_ENV"
            exit 0
          fi

          # Measure from testCompletedAt, written by run-task-definitions.yml at
          # the moment it sets testStatus=completed. createdDate is stamped when
          # the poller first tracks the change set, well before validation
          # finishes, so a long validation would otherwise look stalled the
          # instant it completed. Fall back to createdDate for rows written
          # before testCompletedAt existed.
          # Each state is measured from the moment it was ENTERED:
          #   testing               -> createdDate (mark_changeset_processed
          #                            writes it in the same put_item that sets
          #                            testStatus=testing, so for this state it
          #                            IS the entry time)
          #   completed             -> testCompletedAt
          #   production_dispatched -> productionTriggeredAt (set by the poller's
          #                            update_test_status when it dispatches)
          # Using testCompletedAt for both would report a release dispatched
          # seconds ago as stalled whenever the restriction itself took longer
          # than the window, which is the ordinary case, not an edge one.
          # `//` only substitutes null, not "", and an empty @tsv field would
          # collapse under bash's IFS-whitespace rule: `read` would then shift
          # testStatus into COMPLETED and every column after it would be wrong.
          # nonempty() forces a real value into every field.
          jq -r '
            def nonempty(v): if (v // "") == "" then null else v end;
            .Items[]
            | [ (nonempty(.imageTag.S) // "unknown"),
                (nonempty(.changeSetId.S) // "unknown"),
                (if (.testStatus.S // "") == "production_dispatched"
                 then (nonempty(.productionTriggeredAt.S) // nonempty(.testCompletedAt.S) // nonempty(.createdDate.S) // "unknown")
                 elif (.testStatus.S // "") == "testing"
                 then (nonempty(.createdDate.S) // "unknown")
                 else (nonempty(.testCompletedAt.S) // nonempty(.createdDate.S) // "unknown")
                 end),
                (nonempty(.testStatus.S) // "unknown") ]
            | @tsv
          ' scan.json > waiting.tsv

          STALLED=0
          CUTOFF=$(( $(date -u +%s) - MP_STALL_HOURS * 3600 ))

          while IFS=$'\t' read -r TAG CHANGESET COMPLETED STATUS; do
            # Belt and braces: the jq above should never emit an empty field,
            # but if a column is ever added and one does collapse, this catches
            # it before `date -d ""` turns it into midnight today, which reads
            # as recent and would hide the row rather than report it.
            if [ -z "${COMPLETED:-}" ]; then
              echo "⚠️  ${TAG} (${CHANGESET}, ${STATUS}): no completion time recorded, treating as stalled"
              STALLED=$((STALLED + 1))
              continue
            fi

            CREATED_TS=$(date -u -d "${COMPLETED}" +%s 2>/dev/null || echo 0)

            if [ "${CREATED_TS}" -eq 0 ]; then
              echo "⚠️  ${TAG} (${CHANGESET}, ${STATUS}): unparseable completion time '${COMPLETED}', treating as stalled"
              STALLED=$((STALLED + 1))
              continue
            fi

            AGE_HOURS=$(( ( $(date -u +%s) - CREATED_TS ) / 3600 ))

            if [ "${CREATED_TS}" -lt "${CUTOFF}" ]; then
              echo "❌ ${TAG} (${CHANGESET}, ${STATUS}): waiting ${AGE_HOURS}h for production release"
              STALLED=$((STALLED + 1))
            else
              echo "⏳ ${TAG} (${CHANGESET}, ${STATUS}): waiting ${AGE_HOURS}h, still inside the ${MP_STALL_HOURS}h window"
            fi
          done < waiting.tsv

          echo "STALLED=${STALLED}" >> "$GITHUB_ENV"
          echo "AWAITING=${COUNT}" >> "$GITHUB_ENV"

      # The check above only sees versions the poller already tracked. It is
      # blind to the opposite failure: a test version published to the listing
      # that the poller never picked up at all, so nothing was ever written to
      # DynamoDB. That happens if the poller is down or wedged for longer than
      # its LOOKBACK_DAYS window, after which the version falls out of its scan
      # permanently and no amount of waiting recovers it.
      #
      # A test version still Public and untracked is the signature. Restricted
      # ones have already been through validation.
      - name: Look for test versions the poller never picked up
        run: |
          set -euo pipefail

          aws marketplace-catalog describe-entity \
            --catalog AWSMarketplace \
            --entity-id "${MP_PRODUCT_ID}" \
            --region "${AWS_REGION}" \
            --output json > entity.json

          # Every imageTag the poller knows about, whatever its state.
          aws dynamodb scan \
            --table-name "${MP_TABLE_NAME}" \
            --region "${AWS_REGION}" \
            --projection-expression 'imageTag' \
            --output json > tracked.json

          jq -r '.Items[]?.imageTag.S // empty' tracked.json | sort -u > tracked.txt

          # Public test-* versions, newest first, with their creation dates.
          jq -r '
            .Details
            | fromjson
            | .Versions[]
            | select(.VersionTitle | startswith("test-"))
            | select([.DeliveryOptions[]?.Visibility] | any(. == "Public"))
            | [.VersionTitle, .CreationDate] | @tsv
          ' entity.json > public_test_versions.tsv

          ORPHANED=0
          CUTOFF=$(( $(date -u +%s) - MP_STALL_HOURS * 3600 ))
          # Ignore ancient history; this is about recent releases going missing.
          FLOOR=$(( $(date -u +%s) - 30 * 86400 ))

          while IFS=$'\t' read -r TITLE CREATED; do
            [ -z "${TITLE:-}" ] && continue

            if grep -Fxq "${TITLE}" tracked.txt; then
              continue
            fi

            # An empty CreationDate must not be parsed. GNU date accepts "" and
            # returns midnight TODAY (verified on coreutils 9.4), which sails
            # past both the floor and the cutoff, so the version would be
            # silently dropped instead of reported.
            if [ -z "${CREATED:-}" ]; then
              echo "⚠️  ${TITLE}: no CreationDate on the listing, treating as orphaned"
              ORPHANED=$((ORPHANED + 1))
              continue
            fi

            CREATED_TS=$(date -u -d "${CREATED}" +%s 2>/dev/null || echo 0)

            if [ "${CREATED_TS}" -eq 0 ]; then
              echo "⚠️  ${TITLE}: unparseable CreationDate '${CREATED}', treating as orphaned"
              ORPHANED=$((ORPHANED + 1))
              continue
            fi

            [ "${CREATED_TS}" -lt "${FLOOR}" ] && continue

            if [ "${CREATED_TS}" -lt "${CUTOFF}" ]; then
              AGE_HOURS=$(( ( $(date -u +%s) - CREATED_TS ) / 3600 ))
              echo "❌ ${TITLE}: published ${AGE_HOURS}h ago, still Public, and the poller never tracked it"
              ORPHANED=$((ORPHANED + 1))
            fi
          done < public_test_versions.tsv

          if [ "${ORPHANED}" -eq 0 ]; then
            echo "✅ Every recent public test version is tracked."
          fi

          echo "ORPHANED=${ORPHANED}" >> "$GITHUB_ENV"

      # always(), with defaults below: if a scan step fails before writing
      # GITHUB_ENV the summary should still say what was known, rather than the
      # watchdog going quiet at exactly the moment something is wrong.
      - name: Report
        if: always()
        run: |
          set -euo pipefail

          AWAITING="${AWAITING:-0}"
          STALLED="${STALLED:-0}"
          ORPHANED="${ORPHANED:-0}"

          {
            echo "## Marketplace release watchdog"
            echo ""
            echo "Awaiting release: ${AWAITING}. Stalled beyond ${MP_STALL_HOURS}h: ${STALLED}."
            echo "Published but never tracked by the poller: ${ORPHANED}."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${ORPHANED}" -gt 0 ]; then
            {
              echo ""
              echo "A test version reached the listing but the poller never adopted it."
              echo "Likely the poller was down or wedged for longer than its LOOKBACK_DAYS"
              echo "window, after which the version falls out of its scan for good."
              echo "Validation for these has to be dispatched by hand."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${STALLED}" -gt 0 ]; then
            {
              echo ""
              echo "A tracked test image has not reached production release. Usual causes:"
              echo ""
              echo "* validation was dispatched but the ECS run or the restrict step never"
              echo "  reported back, so the row is still at testStatus=testing"
              echo "* the poller cannot match the restriction change set, so the release never triggers"
              echo "* the restriction change set failed on the marketplace side"
              echo "* the production dispatch failed and nothing retried"
              echo ""
              echo "Check the PollMarketplaceChangeSetStatus logs and the change sets on the listing."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::${STALLED} marketplace release(s) stalled for more than ${MP_STALL_HOURS}h."
          fi

          if [ "${STALLED}" -gt 0 ] || [ "${ORPHANED}" -gt 0 ]; then
            if [ "${ORPHANED}" -gt 0 ]; then
              echo "::error::${ORPHANED} published test version(s) were never picked up by the poller."
            fi
            exit 1
          fi

          echo "✅ Everything waiting is still inside the expected window, and every recent test version is tracked."

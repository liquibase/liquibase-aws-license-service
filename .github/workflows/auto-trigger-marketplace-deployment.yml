name: Auto-trigger Marketplace Deployment (Dry Run)

# This workflow automatically initiates test deployments when liquibase-secure version changes
#
# Purpose:
# - Detects when a new liquibase-secure version is merged to main branch
# - Automatically triggers test image deployment to AWS Marketplace
# - Starts the automated testing pipeline without manual intervention
#
# How it works:
# - Triggers when Dockerfile or pom.xml are pushed to main
# - Uses git diff on BOTH pom.xml (<liquibase-secure.version>) and the Dockerfile
#   (FROM liquibase/liquibase-secure:<version>) to detect if the version actually changed.
#   Dependabot bumps these in separate PRs/commits, so a commit may touch only one file.
# - Skips if version is unchanged (prevents false triggers on other pom.xml/Dockerfile edits)
# - Generates test image tag: test-<version> (e.g., test-5.0.2)
# - Triggers deploy-extension-to-marketplace.yml in dry_run mode
#
# Trigger conditions:
# - Automatically: On push to main when Dockerfile or pom.xml change
# - Automatically: Via workflow_dispatch from dependabot-sync-and-merge.yml after merging liquibase-secure PRs
# - Manually: Can be triggered via workflow_dispatch for testing

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New liquibase-secure version (passed from dependabot-sync-and-merge.yml to bypass git diff detection)'
        required: false
        type: string

concurrency:
  group: marketplace-deployment
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Fetch full history to properly detect changes

      - name: Extract current version from pom.xml
        id: current_version
        run: |
          CURRENT_VERSION=$(grep -oE '<liquibase-secure.version>[^<]+</liquibase-secure.version>' pom.xml | sed -E 's/<\/?liquibase-secure.version>//g')
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Check if liquibase-secure version changed
        id: version_changed
        env:
          CURRENT_VERSION_IN: ${{ steps.current_version.outputs.version }}
          INPUT_VERSION_IN: ${{ inputs.new_version }}
        run: |
          CURRENT_VERSION="${CURRENT_VERSION_IN}"
          INPUT_VERSION="${INPUT_VERSION_IN}"

          # If new_version was passed via workflow_dispatch, use it directly
          # This avoids the fragile git diff approach when triggered by dependabot-sync-and-merge.yml
          if [ -n "$INPUT_VERSION" ]; then
            # new_version becomes the marketplace test tag, and a marketplace
            # version title is permanent. If the caller names a version this
            # checkout does not actually contain, the image gets labelled with a
            # version it is not built from: exactly the mislabelled test-5.2.2
            # (built from a 5.2.1 base) that made 5.2.2 unreleasable. The caller
            # dispatches after merging its bump, so disagreement here means main
            # moved underneath it and the run must not proceed.
            if [ "$INPUT_VERSION" != "$CURRENT_VERSION" ]; then
              echo "::error::Dispatched with new_version '$INPUT_VERSION' but this checkout of pom.xml has '$CURRENT_VERSION'. Refusing to label an image with a version it was not built from."
              exit 1
            fi

            echo "✅ Version provided via workflow_dispatch input: $INPUT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            # Fallback: detect version change via git diff (for push events).
            # Check BOTH pom.xml (<liquibase-secure.version>) and the Dockerfile
            # (FROM liquibase/liquibase-secure:<version>). Dependabot bumps these
            # in separate PRs that can merge in separate commits, so a commit may
            # touch only one of them. Diffing only pom.xml misses Dockerfile-only bumps.

            # --- pom.xml ---
            POM_DIFF=$(git diff HEAD~1 HEAD -- pom.xml | grep -E '[-+].*<liquibase-secure.version>' || true)
            POM_OLD=$(echo "$POM_DIFF" | grep -E '^-.*<liquibase-secure.version>' | sed -E 's/.*<liquibase-secure.version>([^<]+)<\/liquibase-secure.version>.*/\1/' || echo "")
            POM_NEW=$(echo "$POM_DIFF" | grep -E '^\+.*<liquibase-secure.version>' | sed -E 's/.*<liquibase-secure.version>([^<]+)<\/liquibase-secure.version>.*/\1/' || echo "")

            # --- Dockerfile ---
            DOCKER_DIFF=$(git diff HEAD~1 HEAD -- Dockerfile | grep -E '^[-+]FROM liquibase/liquibase-secure:' || true)
            DOCKER_OLD=$(echo "$DOCKER_DIFF" | grep -E '^-FROM liquibase/liquibase-secure:' | sed -E 's/.*liquibase-secure:([^ ]+).*/\1/' || echo "")
            DOCKER_NEW=$(echo "$DOCKER_DIFF" | grep -E '^\+FROM liquibase/liquibase-secure:' | sed -E 's/.*liquibase-secure:([^ ]+).*/\1/' || echo "")

            # A real bump requires a new version that differs from the old one, in either file.
            POM_CHANGED=false
            if [ -n "$POM_NEW" ] && [ "$POM_OLD" != "$POM_NEW" ]; then POM_CHANGED=true; fi
            DOCKER_CHANGED=false
            if [ -n "$DOCKER_NEW" ] && [ "$DOCKER_OLD" != "$DOCKER_NEW" ]; then DOCKER_CHANGED=true; fi

            if [ "$POM_CHANGED" = "true" ] || [ "$DOCKER_CHANGED" = "true" ]; then
              # Prefer the version from pom.xml when it changed; otherwise use the Dockerfile.
              if [ "$POM_CHANGED" = "true" ]; then
                OLD_VERSION="$POM_OLD"
                NEW_VERSION="$POM_NEW"
              else
                OLD_VERSION="$DOCKER_OLD"
                NEW_VERSION="$DOCKER_NEW"
              fi
              echo "✅ liquibase-secure version changed from ${OLD_VERSION:-unknown} to $NEW_VERSION (pom.xml changed: $POM_CHANGED, Dockerfile changed: $DOCKER_CHANGED)"
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            else
              if [ -n "$POM_DIFF" ] || [ -n "$DOCKER_DIFF" ]; then
                echo "ℹ️  liquibase-secure version line modified but version unchanged. Skipping deployment trigger."
              else
                echo "ℹ️  No change to liquibase-secure version detected in this commit. Skipping deployment trigger."
              fi
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Verify Dockerfile and pom.xml versions match
        if: steps.version_changed.outputs.changed == 'true'
        id: verify_match
        env:
          POM_VERSION_IN: ${{ steps.current_version.outputs.version }}
        run: |
          DOCKERFILE_VERSION=$(grep -E '^FROM liquibase/liquibase-secure:' Dockerfile | head -1 | cut -d':' -f2 | cut -d' ' -f1)
          POM_VERSION="${POM_VERSION_IN}"

          echo "Dockerfile version: $DOCKERFILE_VERSION"
          echo "pom.xml version: $POM_VERSION"

          if [ "$DOCKERFILE_VERSION" != "$POM_VERSION" ]; then
            echo "❌ Version mismatch! Dockerfile: $DOCKERFILE_VERSION, pom.xml: $POM_VERSION"
            echo "Skipping deployment trigger due to version mismatch."
            echo "match=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ Versions match: $POM_VERSION"
            echo "match=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate test version tag
        if: steps.version_changed.outputs.changed == 'true' && steps.verify_match.outputs.match == 'true'
        id: test_version
        env:
          # Expanded into the environment rather than into the script text.
          # new_version can originate from the workflow_dispatch input, so a
          # crafted value would otherwise run as shell code in this step.
          NEW_VERSION: ${{ steps.version_changed.outputs.new_version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Use the liquibase-secure version for the test tag, plus the run
          # number and attempt so each attempt gets a tag of its own.
          #
          # The tag used to be exactly test-<version>. Two things make that a
          # one-shot: ECR tags are immutable, so a rebuild cannot reuse the tag,
          # and AWS Marketplace version titles are permanent and cannot be
          # deleted, only restricted. So any attempt that failed part-way left
          # that version permanently unreleasable and recovery meant inventing a
          # tag by hand. That is how the listing accumulated its devopstest-*
          # entries. Keep the test- prefix: the polling Lambda selects on it.
          # run_number alone is not enough: it is fixed for the life of a run,
          # and "Re-run failed jobs" keeps it while incrementing run_attempt.
          # Without the attempt, the retry path described above regenerates the
          # previous tag and hits the immutable ECR tag all over again.
          LIQUIBASE_SECURE_VERSION="${NEW_VERSION}"
          TEST_VERSION="test-${LIQUIBASE_SECURE_VERSION}-${RUN_NUMBER}.${RUN_ATTEMPT}"
          echo "Generated test version tag: $TEST_VERSION"
          echo "tag=$TEST_VERSION" >> $GITHUB_OUTPUT

      - name: Trigger deploy-extension-to-marketplace workflow (dry run)
        if: steps.version_changed.outputs.changed == 'true' && steps.verify_match.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same reason as the Generate and Post summary steps: the tag is
          # derived from new_version, which can come from the dispatch input.
          TEST_TAG_IN: ${{ steps.test_version.outputs.tag }}
        run: |
          TEST_TAG="${TEST_TAG_IN}"
          echo "🚀 Triggering deploy-extension-to-marketplace.yml (dry_run=true)"
          echo "   Test image tag: $TEST_TAG"

          gh workflow run deploy-extension-to-marketplace.yml \
            --ref main \
            -f image_tag="$TEST_TAG" \
            -f dry_run=true

          echo "✅ Workflow triggered successfully!"
          echo "Check the workflow run at: https://github.com/${{ github.repository }}/actions/workflows/deploy-extension-to-marketplace.yml"

      # Every value here goes through env, not template expansion. new_version
      # can originate from the workflow_dispatch input, and a `run:` block is a
      # shell script: expanding it inline would execute whatever it contains.
      # The Generate step above was already hardened this way; this step is the
      # same sink and was missed.
      - name: Post summary
        if: always()
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
          CHANGED: ${{ steps.version_changed.outputs.changed }}
          OLD_VERSION: ${{ steps.version_changed.outputs.old_version }}
          NEW_VERSION: ${{ steps.version_changed.outputs.new_version }}
          MATCH: ${{ steps.verify_match.outputs.match }}
        run: |
          echo "## Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Current Version:** ${CURRENT_VERSION}" >> $GITHUB_STEP_SUMMARY

          if [ "${CHANGED}" == "true" ]; then
            echo "**Previous Version:** ${OLD_VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "**New Version:** ${NEW_VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "${MATCH}" == "true" ]; then
              echo "✅ **Status:** New version detected! Deployment workflow triggered in dry-run mode" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Status:** Version mismatch between Dockerfile and pom.xml" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️  **Status:** No liquibase-secure version change detected in this commit, deployment not triggered" >> $GITHUB_STEP_SUMMARY
          fi
